<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Dropsite</title>
  <style>
    :root{--bg:#0a0a0f;--card:#111118;--border:#1f2937;--accent:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);--text:#fff;--muted:#6b7280;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
   .container{max-width:500px}
   .error-code{font-size:120px;font-weight:900;background:var(--accent);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;line-height:1}
    h1{font-size:32px;font-weight:900;margin-bottom:16px}
    p{color:var(--muted);font-size:18px;line-height:1.6;margin-bottom:32px}
   .btn{display:inline-block;background:var(--accent);color:#fff;padding:14px 32px;border:none;border-radius:8px;font-weight:700;text-decoration:none;cursor:pointer}
   .btn:hover{opacity:.9}
   .logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff;margin-bottom:48px;display:inline-block}
    @media (max-width:480px){.error-code{font-size:80px}h1{font-size:24px}}
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="logo">DROPSITE</a>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to building sites.</p>
    <a href="dashboard.html" class="btn">Go to Dashboard</a>
  </div>
</body>
</html>
